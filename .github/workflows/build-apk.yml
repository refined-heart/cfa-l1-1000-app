name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare and validate 1000-question dataset
        run: npm run check:data

      - name: Generate native Android project
        run: CI=1 npx expo prebuild --platform android --clean

      - name: Build offline release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate release APK
        id: apk
        shell: bash
        run: |
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" CFA-L1-1000-release.apk
          echo "path=CFA-L1-1000-release.apk" >> "$GITHUB_OUTPUT"

      - name: Verify JS bundle is embedded
        shell: bash
        run: |
          unzip -l CFA-L1-1000-release.apk | tee apk-contents.txt
          grep -q 'assets/index.android.bundle' apk-contents.txt
          echo "PASS: assets/index.android.bundle is embedded."

      - name: Verify APK is a non-debuggable release
        shell: bash
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging CFA-L1-1000-release.apk | tee apk-badging.txt
          if grep -q 'application-debuggable' apk-badging.txt; then
            echo "FAIL: APK is debuggable"
            exit 1
          fi
          echo "PASS: APK is non-debuggable and does not require Metro."

      - name: APK checksum
        run: sha256sum CFA-L1-1000-release.apk | tee CFA-L1-1000-release.apk.sha256

      - name: Upload verified release APK
        uses: actions/upload-artifact@v4
        with:
          name: CFA-L1-1000-Release-APK
          path: |
            CFA-L1-1000-release.apk
            CFA-L1-1000-release.apk.sha256
            apk-contents.txt
            apk-badging.txt
          retention-days: 30
