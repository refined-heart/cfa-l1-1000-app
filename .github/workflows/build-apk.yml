name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME" || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare and validate sources
        run: npm run check:data

      - name: Generate native Android project
        run: CI=1 npx expo prebuild --platform android

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CFA-L1-1000.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFA-L1-1000-APK
          path: CFA-L1-1000.apk
          retention-days: 30
